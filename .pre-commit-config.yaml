repos:
# Spelling
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    -   id: codespell
        args: [-C, "3", -L, "notin"]
        types_or: [python, rst, markdown, cython, c, terraform]
        additional_dependencies: [tomli]
# Python
-   repo: local
    hooks:
    # NOTE: we make `black` a local hook because if it's installed from
    # PyPI (rather than from source) then it'll run twice as fast thanks to mypyc
    -   id: black
        name: black
        description: "Black: The uncompromising Python code formatter"
        entry: black
        language: python
        require_serial: true
        types_or: [python, pyi]
        # Keep this version in sync with black in src/uv.lock
        additional_dependencies: [black==26.10.1]
    # Keeps src/requirements.txt (runtime dependencies, used by the zip build) in sync with uv.lock
    -   id: uv-export-src
        name: uv export src requirements
        description: "Export src/requirements.txt from pyproject.toml and uv.lock"
        entry: bash -c 'cd src && uv export --frozen --no-emit-workspace --no-dev --no-editable -o requirements.txt'
        language: system
        files: ^src/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
    -   id: ruff
        args: [--exit-non-zero-on-fix]
# Terraform
-   repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.104.0
    hooks:
    -   id: terraform_fmt
    -   id: terraform_tflint
    -   id: terraform_validate
    -   id: terraform_docs
        args:
        - --args=--lockfile=false
    -   id: terraform_trivy
        args:
        - --args=--severity HIGH,CRITICAL --skip-dirs .terraform,examples
