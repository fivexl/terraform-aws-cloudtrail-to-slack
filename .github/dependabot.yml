version: 2
updates:
  # Python: security PRs only (limit 0 stops routine version PRs). Security PRs
  # skip the cooldown, so treat them as signals and apply the fix after the soak
  # in AGENTS.md "Dependency updates".
  - package-ecosystem: "uv"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "python"

  # Pins with little advisory coverage: one grouped monthly PR per ecosystem.
  # The 14-day cooldown gives upstream time to catch a hijacked release; majors
  # still open as individual PRs.
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      terraform:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "terraform"

  # Every action is SHA-pinned; without this nothing moves those pins forward.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/src/docker"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    groups:
      pre-commit:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "pre-commit"
