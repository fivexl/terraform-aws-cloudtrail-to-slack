[project]
name = "terraform-aws-cloudtrail-to-slack"
# Placeholder required by uv. The real version is the git tag / GitHub Release.
version = "0.0.0"
description = "Parse AWS CloudTrail events and send alerts to Slack for events that match pre-configured rules"
requires-python = ">=3.14"
dependencies = [
    "python-dateutil>=2.9.0",
    "slack-sdk>=3.21.3,<4",
]

# No [build-system]: this is an application, not an installable package.
# The Lambda code is copied as plain files, and the dependencies are installed
# from the lock file (see docker/Dockerfile.image).

# Development dependencies. Installed with `uv sync`.
[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "boto3>=1.26.97,<2",
    "ruff>=0.17.3,<0.18",
    # Transitive dependency pinned to its patched version so the lock file
    # does not ship a known-vulnerable version:
    #   urllib3 - CVE-2025-66418, CVE-2025-66471, CVE-2026-21441 (decompression
    #             bombs / unbounded decompression chains), all fixed by 2.6.3
    "urllib3>=2.6.3",
]

[tool.uv]
# Soak window: see AGENTS.md "Dependency updates". Older uv ignores it silently.
exclude-newer = "14 days"
required-version = ">=0.12.17"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

line-length = 140

# Assume Python 3.14.
target-version = "py314"

[tool.ruff.lint]
select = [
  # pyflakes
  "F",
  # flake8-annotations
  "ANN",
  # flake8-unused-arguments 
  "ARG",
  # pycodestyle
  "E", "W",
  # flake8-2020
  "YTT",
  # flake8-bugbear
  "B",
  # flake8-quotes
  "Q",
  # flake8-debugger
  "T10",
  # pylint
  "PLC", "PLE", "PLR", "PLW",
  # misc lints
  "PIE",
  # flake8-pyi
  "PYI",
  # tidy imports
  "TID",
  # implicit string concatenation
  "ISC",
  # type-checking imports
  "TCH",
  # comprehensions
  "C4",
  # pygrep-hooks
  "PGH"
]
ignore = [
  # Allow imports inside test functions (common pytest pattern)
  "PLC0415",
  # Don't require moving third-party imports to TYPE_CHECKING blocks
  # (SlackResponse is used at runtime for return type checks)
  "TC002",
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.pyright]
reportGeneralTypeIssues = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = []
